[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhymeforge"
version = "0.1.0"
description = "One-command pipeline for educational toddler songs on YouTube, built on free tools."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6", "Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]
kaggle = ["kaggle>=1.6"]
claude = ["anthropic>=2.10"]
voice = ["piper-tts>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
rhymeforge = "rhymeforge.cli:main"

[tool.setuptools.packages.find]
include = ["rhymeforge*"]

[tool.setuptools.package-data]
rhymeforge = ["kaggle_kernel/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
